<script>
// MATA BERGERAK - FIXED - TIDAK NUTUPIN TOMBOL
const canvas=document.getElementById('eyeCanvas');const ctx=canvas.getContext('2d');let time=0,w,h;
function resize(){let dpr=window.devicePixelRatio||1;canvas.width=canvas.offsetWidth*dpr;canvas.height=canvas.offsetHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);w=canvas.offsetWidth;h=canvas.offsetHeight}resize();addEventListener('resize',resize);
function draw(){time+=0.016;ctx.clearRect(0,0,w,h);let ex=w/2+Math.sin(time*0.5)*18,ey=h/2+Math.cos(time*0.45)*12;ctx.save();ctx.translate(ex,ey);ctx.beginPath();ctx.ellipse(0,0,84,54,0,0,Math.PI*2);ctx.fillStyle='#E8E8E8';ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.3;ctx.stroke();let ix=Math.sin(time*1.1)*6,iy=Math.cos(time*0.9)*4;ctx.beginPath();ctx.arc(ix,iy,32,0,Math.PI*2);ctx.fillStyle='#0a0a0a';ctx.fill();ctx.beginPath();ctx.arc(ix+8,iy-6,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.restore();requestAnimationFrame(draw);}draw();
</script>
